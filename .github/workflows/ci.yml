name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: psych
          POSTGRES_USER: psych
          POSTGRES_PASSWORD: psych_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U psych -d psych"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+psycopg://psych:psych_test_password@localhost:5432/psych
          SECRET_KEY: ci-test-secret
        run: |
          alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://psych:psych_test_password@localhost:5432/psych
          SECRET_KEY: ci-test-secret
        run: |
          pytest -v