services:
  db:
    image: postgres:17
    container_name: psych-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: psych
      POSTGRES_USER: psych
      POSTGRES_PASSWORD: psych_dev_password

    ports:
      - "5432:5432"

    volumes:
      - psych_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: psych-backend
    restart: unless-stopped

    env_file:
      - .env.docker

    ports:
      - "9000:8000"

    depends_on:
      - db

    volumes:
      - ./uploads:/app/uploads

volumes:
  psych_postgres_data: